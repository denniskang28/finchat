services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: semantic_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d semantic_rag"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/semantic_rag
      UPLOAD_DIR: /app/data/uploads
      CORS_ORIGINS: http://localhost:5173
      TABLE_REPAIR_ENABLED: ${TABLE_REPAIR_ENABLED:-true}
      TABLE_PARSE_MODE: ${TABLE_PARSE_MODE:-llm_primary}
      TABLE_PARSE_WORKERS: ${TABLE_PARSE_WORKERS:-4}
      TABLE_REPAIR_PROVIDER: ${TABLE_REPAIR_PROVIDER:-alibaba}
      TABLE_REPAIR_TIMEOUT_SECONDS: ${TABLE_REPAIR_TIMEOUT_SECONDS:-90}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      ALIBABA_BASE_URL: ${ALIBABA_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      ALIBABA_VISION_MODEL: ${ALIBABA_VISION_MODEL:-qwen3.8-flash}
      ALIBABA_EMBEDDING_MODEL: ${ALIBABA_EMBEDDING_MODEL:-qwen3.7-text-embedding}
      ALIBABA_EMBEDDING_DIMENSIONS: ${ALIBABA_EMBEDDING_DIMENSIONS:-1024}
      ALIBABA_EMBEDDING_URL: ${ALIBABA_EMBEDDING_URL:-https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding}
      ALIBABA_RERANK_MODEL: ${ALIBABA_RERANK_MODEL:-qwen3-rerank}
      ALIBABA_RERANK_URL: ${ALIBABA_RERANK_URL:-https://dashscope.aliyuncs.com/compatible-api/v1/reranks}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_VISION_MODEL: ${DEEPSEEK_VISION_MODEL:-deepseek-flash}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_VISION_MODEL: ${OPENAI_COMPATIBLE_VISION_MODEL:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./docs/samples:/app/docs/samples:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
